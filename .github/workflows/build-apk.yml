name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize MainActivity source
        shell: bash
        run: |
          if [ -f .source-transfer/MainActivity.b64.1 ]; then
            mkdir -p app/src/main/java/com/local/convenidiet
            cat .source-transfer/MainActivity.b64.* | base64 -d > app/src/main/java/com/local/convenidiet/MainActivity.java
            test "$(git hash-object app/src/main/java/com/local/convenidiet/MainActivity.java)" = "1a697acd4f5d3cfb5cc5af8e4b36a52ac7a02973"
            rm -rf .source-transfer
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/local/convenidiet/MainActivity.java
            git add -A .source-transfer
            git diff --cached --quiet || git commit -m "Materialize MainActivity source"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CombiniDiet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
